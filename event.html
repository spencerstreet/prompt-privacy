<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>You're invited</title>
  <meta name="theme-color" content="#111111">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --accent: #E8894A;
      --bg: #111111;
      --surface: #1C1C1E;
      --text: #FFFFFF;
      --text-secondary: rgba(255, 255, 255, 0.55);
      --border: rgba(255, 255, 255, 0.08);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── layout ── */
    #app {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── hero ── */
    #hero {
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 340px;
      background: var(--surface) center / cover no-repeat;
      position: relative;
      flex-shrink: 0;
    }

    #hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(17, 17, 17, 0) 30%,
        rgba(17, 17, 17, 0.6) 70%,
        #111111 100%
      );
    }

    /* ── card ── */
    #card {
      width: 100%;
      max-width: 460px;
      padding: 0 22px 56px;
      margin-top: -32px;
      position: relative;
      z-index: 1;
      flex: 1;
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 12px;
    }

    #event-title {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin-bottom: 22px;
    }

    /* ── meta rows ── */
    .meta {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .meta-row {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      font-size: 15px;
      line-height: 1.4;
      color: rgba(255, 255, 255, 0.82);
    }

    .meta-icon {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
      margin-top: 2px;
      color: var(--text-secondary);
    }

    /* ── going pill ── */
    .going-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(232, 137, 74, 0.12);
      border: 1px solid rgba(232, 137, 74, 0.28);
      border-radius: 99px;
      padding: 5px 13px 5px 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 28px;
    }

    .going-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    /* ── divider ── */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 24px 0;
    }

    /* ── CTA ── */
    #cta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: var(--accent);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
      padding: 16px;
      border-radius: 14px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.12s;
    }

    #cta:active {
      opacity: 0.82;
    }

    .cta-sub {
      text-align: center;
      color: var(--text-secondary);
      font-size: 12px;
      margin-top: 11px;
    }

    /* ── loading state ── */
    #loading {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      min-height: 60vh;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 2.5px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── error state ── */
    #error {
      flex: 1;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 28px;
      min-height: 60vh;
    }

    .error-icon {
      font-size: 42px;
      margin-bottom: 18px;
      line-height: 1;
    }

    .error-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .error-body {
      font-size: 14px;
      line-height: 1.55;
      color: var(--text-secondary);
      max-width: 280px;
    }

    /* ── content ── */
    #content {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
<div id="app">
  <!-- Loading -->
  <div id="loading">
    <div class="spinner"></div>
  </div>

  <!-- Error -->
  <div id="error">
    <div class="error-icon">🔗</div>
    <div class="error-title">Link not found</div>
    <div class="error-body">This invite link is invalid or has expired.</div>
  </div>

  <!-- Content -->
  <div id="content">
    <div id="hero"></div>
    <div id="card">
      <p class="eyebrow">You're invited</p>
      <h1 id="event-title"></h1>

      <div class="meta">
        <!-- date/time -->
        <div class="meta-row">
          <svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2.5"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <span id="event-datetime"></span>
        </div>

        <!-- location -->
        <div class="meta-row" id="location-row">
          <svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
            <circle cx="12" cy="9" r="2.5"/>
          </svg>
          <span id="event-location"></span>
        </div>

        <!-- creator -->
        <div class="meta-row">
          <svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <span id="event-creator"></span>
        </div>
      </div>

      <div class="going-pill">
        <div class="going-dot"></div>
        <span id="event-going"></span>
      </div>

      <div class="divider"></div>

      <a id="cta" href="#">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
        </svg>
        Join on Prompt
      </a>
      <p class="cta-sub">Download on the App Store</p>
    </div>
  </div>
</div>

<script>
  const FUNCTION_BASE = 'https://us-central1-do-app-c24e7.cloudfunctions.net/getEventByToken';
  const APP_STORE_URL = 'https://apps.apple.com/app/id000000000'; // TODO: real App Store ID

  function showState(state) {
    document.getElementById('loading').style.display = state === 'loading' ? 'flex' : 'none';
    document.getElementById('error').style.display   = state === 'error'   ? 'flex' : 'none';
    document.getElementById('content').style.display = state === 'content' ? 'flex' : 'none';
  }

  function formatDateTime(startIso, endIso) {
    if (!startIso) return '';
    const start = new Date(startIso);
    const datePart = start.toLocaleDateString('en-GB', {
      weekday: 'short', day: 'numeric', month: 'long'
    });
    if (!endIso) return datePart;
    const end = new Date(endIso);
    const startTime = start.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    const endTime   = end.toLocaleTimeString('en-GB',   { hour: '2-digit', minute: '2-digit' });
    // All-day guard: Cloud Function sets end to 23:59
    if (startTime === '00:00' || endTime === '23:59') return datePart;
    return `${datePart} · ${startTime}–${endTime}`;
  }

  async function load() {
    showState('loading');

    const params = new URLSearchParams(window.location.search);
    const token  = params.get('token');
    if (!token) { showState('error'); return; }

    try {
      const res = await fetch(`${FUNCTION_BASE}?token=${encodeURIComponent(token)}`);
      if (!res.ok) { showState('error'); return; }
      const ev = await res.json();

      // Page title
      document.title = ev.title ? `${ev.title} — Prompt` : "You're invited";

      // Hero
      if (ev.coverPhotoUrl) {
        document.getElementById('hero').style.backgroundImage = `url(${ev.coverPhotoUrl})`;
      } else {
        document.getElementById('hero').style.background = '#1C1C1E';
      }

      // Fields
      document.getElementById('event-title').textContent    = ev.title || '';
      document.getElementById('event-datetime').textContent = formatDateTime(ev.start, ev.end);
      document.getElementById('event-creator').textContent  = ev.creatorName ? `by ${ev.creatorName}` : '';
      document.getElementById('event-going').textContent    = `${ev.goingCount ?? 0} going`;

      if (ev.location) {
        document.getElementById('event-location').textContent = ev.location;
      } else {
        document.getElementById('location-row').style.display = 'none';
      }

      document.getElementById('cta').href = APP_STORE_URL;

      showState('content');
    } catch (_) {
      showState('error');
    }
  }

  load();
</script>
</body>
</html>
